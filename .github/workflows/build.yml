name: build

# Every push to main cuts a release. That is deliberate: the app is installed
# by sideload, and a sideload needs a plain public URL to a file - a workflow
# artifact can only be fetched by a logged-in browser, which a phone is not.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  # Pinned rather than taken from flutter.ndkVersion so that the runner can
  # install exactly what Gradle is about to ask for, instead of failing halfway
  # through a build to tell us.
  NDK_VERSION: '28.2.13676358'

jobs:
  # ---------------------------------------------------------------- version
  # One place decides what this build is called. The patch number is the run
  # number, so every push to main is a strictly newer version than the last -
  # which is what AltStore compares to decide whether to offer an update.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          BASE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          MINOR=$(echo "$BASE" | cut -d. -f1,2)
          echo "version=${MINOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "building ${MINOR}.${GITHUB_RUN_NUMBER}"

  # ------------------------------------------------------------------ checks
  # Runs in about a minute and catches the ordinary mistakes without waiting
  # for a macOS runner. The DSP part is the interesting one: it renders the
  # real engine and measures the result, so a change that makes the
  # synthesizer clip, produce a NaN or fall silent fails here rather than in
  # someone's headphones.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build the offline renderer
        run: |
          cmake -S tools/render -B tools/render/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/render/build -j

      - name: Render and measure every mood
        run: |
          set -euo pipefail
          for m in 0 1 2 3 4 5; do
            ./tools/render/build/nulleig_render "/tmp/mood$m.wav" 45 --mood "$m"
          done
          # The tour walks both axes and every mood transition, which is where
          # a synthesizer usually breaks.
          ./tools/render/build/nulleig_render /tmp/tour.wav 120 --tour

      - name: Keep the audio for listening
        uses: actions/upload-artifact@v4
        with:
          name: audio-preview
          path: /tmp/*.wav
          retention-days: 7

  # ----------------------------------------------------------------- android
  android:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - run: flutter pub get
      - name: Build the APK
        run: |
          # NE_VERSION as well as the build name, because the updater compares
          # against it: without it the .apk does not know what it is, stays
          # quiet, and is indistinguishable from one that is up to date.
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build }} \
            --dart-define=NE_VERSION=${{ needs.version.outputs.version }}

      - name: Confirm the engine is actually in the APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          # An APK missing libnulleig.so still installs and still opens - and
          # then shows "the synthesis engine did not load". Catch it here.
          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnulleig.so'; then
            echo "::error::libnulleig.so is not in the APK"
            unzip -l "$APK" | grep 'lib/' || true
            exit 1
          fi

          # The same APK is the television build, and one manifest entry is
          # what makes it one. Without LEANBACK_LAUNCHER a set installs it and
          # then offers no way to start it - invisible from everywhere except a
          # television, so it is checked here beside the other thing that
          # breaks without saying so.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > badging.txt
          if ! grep -q 'leanback-launchable-activity' badging.txt; then
            echo "::error::no LEANBACK_LAUNCHER - a television would install \
          this and then have no way to start it"
            grep -i 'launchable\|uses-feature' badging.txt || true
            exit 1
          fi
          grep -i 'launchable\|uses-feature' badging.txt || true

          ls -lh "$APK"
          # A fixed asset name, with the version in the release title. It is
          # what makes /releases/latest/download/<name> a stable URL, which is
          # what the AltStore manifest and the README both point at.
          cp "$APK" NullEigenvalue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NullEigenvalue.apk
          if-no-files-found: error

  # --------------------------------------------------------------------- ios
  # Unsigned. There are no Apple credentials in this repo and there is not
  # going to be: the app is sideloaded, and AltStore or Sideloadly signs it
  # with the user's own free Apple ID at install time.
  ios:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build }}

      - name: Package an .ipa
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::no Runner.app - the build did not produce one"
            find build/ios -maxdepth 3 -print
            exit 1
          fi
          # Dart resolves the engine at run time out of the process image, so
          # the check is for a symbol rather than for a file. Where that symbol
          # lives depends on how CocoaPods linked the pod: Flutter's generated
          # Podfile uses `use_frameworks!`, which makes nulleig an embedded
          # dynamic framework, but a static pod would put it in the app binary
          # instead. Both are fine for dlsym; neither being true is a build
          # that launches and then cannot make a sound.
          echo "--- bundle ---"
          ls -1 "$APP" || true
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks)"
          FOUND=""
          for BIN in "$APP/Runner" "$APP"/Frameworks/*.framework/*; do
            [ -f "$BIN" ] || continue
            case "$BIN" in *.plist|*.png|*.nib|*.bundle) continue;; esac
            if nm -gU "$BIN" 2>/dev/null | grep -q ' _ne_create$'; then
              echo "ne_create found in $BIN"
              FOUND="$BIN"
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::ne_create is nowhere in the bundle - the engine was not linked in"
            exit 1
          fi
          # An .ipa is a zip with the .app inside Payload/. Doing it by hand,
          # rather than with -exportArchive, is what keeps this signing-free.
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/NullEigenvalue.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/NullEigenvalue.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: NullEigenvalue.ipa
          if-no-files-found: error

  # ----------------------------------------------------------------- windows
  # The desktop builds all pass NE_VERSION through --dart-define. That is what
  # the in-app updater compares against the newest release tag; a build without
  # it - which is every build made on a developer's machine - never offers an
  # update at all.
  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Build
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
          --dart-define=NE_VERSION=${{ needs.version.outputs.version }}

      - name: Confirm the engine is next to the app
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/windows/x64/runner/Release
          # Same check as the APK's, for the same reason: a bundle without
          # nulleig.dll installs, launches, and then says the synthesis engine
          # did not load. The Flutter tooling copies it because the plugin's
          # windows/CMakeLists.txt exports nulleig_bundled_libraries, and that
          # is exactly the kind of wiring that breaks silently.
          if [ ! -f "$OUT/nulleig.dll" ]; then
            echo "::error::nulleig.dll is not in the bundle"
            ls -R "$OUT" | head -50
            exit 1
          fi
          ls -lh "$OUT/nulleig.dll" "$OUT/null_eigenvalue.exe"

      - name: Build the installer
        shell: pwsh
        run: |
          # Searched for rather than hardcoded. The runner image ships Inno
          # Setup under Program Files (x86), but it has moved between image
          # versions before and a wrong literal path fails as "file not found"
          # ten minutes into the build.
          $iscc = Get-ChildItem `
            "C:\Program Files (x86)", "C:\Program Files", "$env:LOCALAPPDATA\Programs" `
            -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) is not on this runner" }
          Write-Host "using $iscc"
          & $iscc /DAppVersion=${{ needs.version.outputs.version }} windows\installer\null_eigenvalue.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Collect it
        shell: bash
        run: |
          set -euo pipefail
          cp windows/installer/NullEigenvalue-Setup.exe .
          ls -lh NullEigenvalue-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NullEigenvalue-Setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------- macos
  macos-desktop:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Build
        run: >
          flutter build macos --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
          --dart-define=NE_VERSION=${{ needs.version.outputs.version }}

      - name: Sign it to itself, and check the engine came along
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Null Eigenvalue.app"
          if [ ! -d "$APP" ]; then
            echo "::error::no .app - the build did not produce one"
            ls -R build/macos/Build/Products | head -40
            exit 1
          fi
          # Same symbol check as the .ipa's. The Mac links the pod as an
          # embedded framework, so this is where it should be - but the Dart
          # binding falls back to the process image, and a static pod would put
          # it there instead. Either is fine; neither is not.
          FOUND=""
          for BIN in "$APP/Contents/MacOS/Null Eigenvalue" \
                     "$APP"/Contents/Frameworks/*.framework/Versions/A/*; do
            [ -f "$BIN" ] || continue
            if nm -gU "$BIN" 2>/dev/null | grep -q ' _ne_create$'; then
              echo "ne_create found in $BIN"
              FOUND="$BIN"
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::ne_create is nowhere in the bundle"
            exit 1
          fi

          # Ad-hoc, because there are no Apple credentials in this repo and
          # there are not going to be. On Apple silicon an unsigned binary will
          # not launch at all, so "signed by nobody" is the floor rather than a
          # nicety. Frameworks first: signing the bundle seals what is inside
          # it, and re-signing a nested framework afterwards breaks that seal.
          for F in "$APP"/Contents/Frameworks/*; do
            [ -e "$F" ] || continue
            codesign --force --sign - --timestamp=none "$F"
          done
          codesign --force --sign - --timestamp=none \
            --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package a disk image
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Null Eigenvalue.app"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          # The one convention every Mac user already knows: the app, and an
          # arrow pointing at Applications.
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Null Eigenvalue" \
            -srcfolder "$STAGE" -ov -format UDZO NullEigenvalue.dmg
          ls -lh NullEigenvalue.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: NullEigenvalue.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------- linux
  # Deliberately not ubuntu-latest. An AppImage is only as portable as the
  # glibc it was linked against, and building on the newest image would produce
  # one that refuses to start on any distribution older than the runner.
  linux-desktop:
    runs-on: ubuntu-22.04
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Install what the GTK runner needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Build
        run: >
          flutter build linux --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
          --dart-define=NE_VERSION=${{ needs.version.outputs.version }}

      - name: Confirm the engine is in the bundle
        run: |
          set -euo pipefail
          OUT=build/linux/x64/release/bundle
          if [ ! -f "$OUT/lib/libnulleig.so" ]; then
            echo "::error::libnulleig.so is not in the bundle"
            ls -R "$OUT" | head -50
            exit 1
          fi
          ls -lh "$OUT/lib/libnulleig.so" "$OUT/null_eigenvalue"

      - name: Package an AppImage
        run: |
          set -euo pipefail
          export ARCH=x86_64
          DIR=NullEigenvalue.AppDir
          mkdir -p "$DIR/usr/bin"
          cp -r build/linux/x64/release/bundle/* "$DIR/usr/bin/"
          cp linux/nulleigenvalue.png "$DIR/nulleigenvalue.png"

          cat > "$DIR/nulleigenvalue.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Null Eigenvalue
          Comment=A generative drone instrument
          Exec=null_eigenvalue
          Icon=nulleigenvalue
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF

          # The runner is linked with an rpath of $ORIGIN/lib and finds its own
          # data directory relative to the executable, so there is nothing to
          # set up here - only a cd, so that a relative path in someone's shell
          # cannot decide where the app thinks it lives.
          cat > "$DIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/usr/bin" || exit 1
          exec ./null_eigenvalue "$@"
          EOF
          chmod +x "$DIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run, because the runner has no FUSE and
          # installing libfuse2 to build a file is a strange thing to do.
          ./appimagetool --appimage-extract-and-run \
            "$DIR" NullEigenvalue-x86_64.AppImage
          ls -lh NullEigenvalue-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: NullEigenvalue-x86_64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------- release
  release:
    runs-on: ubuntu-latest
    needs: [version, checks, android, ios, windows, macos-desktop, linux-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # All five into the working directory. The asset names are what the
      # in-app updater looks for and what /releases/latest/download/<name>
      # resolves to, so they are fixed and the version lives in the release
      # title. Named one at a time rather than fetched wholesale, because a
      # bare download-artifact would also drag in the checks job's forty
      # megabytes of preview audio.
      - uses: actions/download-artifact@v4
        with: { name: android-apk }
      - uses: actions/download-artifact@v4
        with: { name: ios-ipa }
      - uses: actions/download-artifact@v4
        with: { name: windows-installer }
      - uses: actions/download-artifact@v4
        with: { name: macos-dmg }
      - uses: actions/download-artifact@v4
        with: { name: linux-appimage }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh NullEigenvalue*
          cat > notes.md <<EOF
          Built from \`${GITHUB_SHA:0:7}\`.

          **iPhone** — \`NullEigenvalue.ipa\` is **unsigned**. The easiest route is to add
          this AltStore source once and let it update itself from then on:

          \`https://doctorspider42.github.io/null-eigenvalue/altstore.json\`

          Otherwise sign and install the .ipa by hand with [AltStore](https://altstore.io)
          or [Sideloadly](https://sideloadly.io) using your own Apple ID. A free account
          works; the app then has to be re-signed every seven days.

          **Android** — \`NullEigenvalue.apk\` installs directly. It is signed with a debug
          key, so the phone will ask you to allow installs from wherever you got it.

          **Windows** — \`NullEigenvalue-Setup.exe\` installs under your own profile, so it
          needs no administrator. SmartScreen will warn about an unknown publisher; the
          installer is not signed and there is no certificate in this repo.

          **macOS** — \`NullEigenvalue.dmg\`. Signed to itself and not notarised, so the
          first launch has to be right-click → Open, or:
          \`xattr -dr com.apple.quarantine "/Applications/Null Eigenvalue.app"\`

          **Linux** — \`NullEigenvalue-x86_64.AppImage\`. \`chmod +x\` it and run it.

          The three desktop builds check for a newer release themselves and can install
          it from inside the app.

          Plays with the screen off, and takes play / pause / mood from the lock screen.
          EOF
          gh release create "v${V}" \
            NullEigenvalue.ipa \
            NullEigenvalue.apk \
            NullEigenvalue-Setup.exe \
            NullEigenvalue.dmg \
            NullEigenvalue-x86_64.AppImage \
            --target "$GITHUB_SHA" \
            --title "Null Eigenvalue ${V}" \
            --notes-file notes.md

  # Point the AltStore source at the release we just published. Called from
  # here rather than triggered by the release event, because GitHub will not
  # start a workflow from an event its own token raised.
  altstore:
    needs: release
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/altstore-source.yml
